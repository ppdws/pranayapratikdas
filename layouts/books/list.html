{{ define "main" }}
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
    </header>
    
    <div class="post-content">
        {{ .Content }}
        
        <!-- Books Grid -->
        <div class="books-grid" style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        ">
            {{ range .Pages }}
            <div class="book-card" style="
                text-align: center;
                transition: transform 0.3s ease;
            ">
                <a href="{{ .Permalink }}" style="text-decoration: none; color: inherit;">
                    <!-- Book Cover -->
                    <div class="book-cover" style="
                        margin-bottom: 1rem;
                        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                        border-radius: 8px;
                        overflow: hidden;
                    ">
                        <img src="{{ .Params.cover.image | absURL }}" 
                             alt="{{ .Params.cover.alt }}"
                             style="
                                 width: 100%;
                                 height: 300px;
                                 object-fit: cover;
                                 transition: transform 0.3s ease;
                             "
                             onmouseover="this.style.transform='scale(1.05)'"
                             onmouseout="this.style.transform='scale(1)'">
                    </div>
                    
                    <!-- Book Title -->
                    <h3 style="
                        margin: 0.5rem 0;
                        font-size: 1.1rem;
                        font-weight: 600;
                        line-height: 1.3;
                    ">{{ .Title }}</h3>
                    
                    <!-- Book Author -->
                    <p style="
                        margin: 0;
                        color: #666;
                        font-size: 0.9rem;
                    ">By {{ .Params.author }}</p>
                    
                    <!-- Rating (Optional) -->
                    {{ if .Params.rating }}
                    <div class="rating" style="margin-top: 0.5rem;">
                        {{ range seq .Params.rating }}⭐{{ end }}
                    </div>
                    {{ end }}
                </a>
            </div>
            {{ end }}
        </div>
    </div>
</article>

<style>
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2rem;
    margin-top: 2rem;
}

.book-card:hover {
    transform: translateY(-5px);
}

@media (max-width: 768px) {
    .books-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1.5rem;
    }
}

@media (max-width: 480px) {
    .books-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
    }
}
</style>
{{ end }}
