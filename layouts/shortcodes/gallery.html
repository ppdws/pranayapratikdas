{{- $main := .Get 0 -}}
{{- $thumbs := after 1 .Params -}}

<div class="split-gallery">
  <!-- Left Column: One large image -->
  <div class="split-gallery__left">
    <a href="{{ $main | relURL }}" target="_blank" class="split-gallery__link">
      <img src="{{ $main | relURL }}" alt="Main image" loading="lazy">
    </a>
  </div>

  <!-- Right Column: Multi‑row grid -->
  <div class="split-gallery__right">
    {{- range $thumbs }}
      {{- $img := . | safeHTML }}
      <a href="{{ $img | relURL }}" target="_blank" class="split-gallery__link">
        <img src="{{ $img | relURL }}" alt="Thumbnail" loading="lazy">
      </a>
    {{- end }}
  </div>
</div>
