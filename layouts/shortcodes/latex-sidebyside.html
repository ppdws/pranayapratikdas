{{- $pdf := .Get "pdf" -}}
{{- $latex := .Get "latex" -}}
{{- $width := .Get "width" | default "48%" -}}

<div style="display: flex; gap: 2%; flex-wrap: wrap;">
  <!-- LaTeX Code Panel -->
  <div style="flex: 1; min-width: 250px; width: {{ $width }};">
    <h3>LaTeX Source</h3>
    <pre style="background: #f5f5f5; padding: 1rem; border-radius: 5px; overflow-x: auto;">
      <code class="language-latex">{{ $latex | safeHTML }}</code>
    </pre>
  </div>
  
  <!-- PDF Output Panel -->
  <div style="flex: 1; min-width: 250px; width: {{ $width }};">
    <h3>Rendered Output</h3>
    {{- partial "pdf-viewer.html" (dict "src" $pdf "height" "500px") -}}
  </div>
</div>
